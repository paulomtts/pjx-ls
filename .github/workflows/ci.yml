name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # node --test runs the TypeScript test files natively (type stripping),
          # which is unflagged from Node 23.6+; 24 is the current line.
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Server tests
        run: npm run test:lsp

      - name: Install ruff
        run: pipx install ruff==0.16.0

      - name: Ruff tests
        run: PJX_REQUIRE_RUFF=1 npm run test:ruff

      - name: Editor tests
        run: xvfb-run -a npm run test:editor

  # Separate from `build` so a red run names its cause. It checks out exactly the
  # ref recorded in SOURCE.json, so it stays green until someone re-syncs. To update:
  # node scripts/sync-pyjinhx.mjs <clean checkout>, read the corpus diff, fix the
  # grammar, commit.
  pyjinhx-drift:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read the recorded pyjinhx ref
        id: source
        run: echo "ref=$(node -p "JSON.parse(require('fs').readFileSync('test/fixtures/pyjinhx/SOURCE.json')).ref")" >> "$GITHUB_OUTPUT"

      - name: Check out pyjinhx at that ref
        uses: actions/checkout@v4
        with:
          repository: paulomtts/pyjinhx
          ref: ${{ steps.source.outputs.ref }}
          path: pyjinhx

      - name: Compare the vendored block grammar and corpus
        run: node scripts/sync-pyjinhx.mjs --check pyjinhx

  # Weekly and non-blocking: shows what the next re-sync will bring.
  pyjinhx-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out pyjinhx master
        uses: actions/checkout@v4
        with:
          repository: paulomtts/pyjinhx
          ref: master
          path: pyjinhx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compare with pyjinhx master
        run: node scripts/sync-pyjinhx.mjs --check pyjinhx

  # The reader and the fixture follow what pyjinhx prints: regenerate the fixture with the
  # real command, fail if it changed, and run the contract test against it.
  contract:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pyjinhx
        run: pip install 'pyjinhx==1.17.*'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate the manifest fixture
        run: |
          node scripts/gen-manifest-fixture.mjs python
          git diff --exit-code test/fixtures/manifest/project.json

      - name: Contract test
        run: PJX_PYTHON=python npm test
